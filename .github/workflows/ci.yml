name: CI

# Unit tests -> integration tests + Swarm end-to-end load test -> image.
# Every push and pull request runs the tests (the end-to-end job builds a
# throwaway amd64 MCP image on the runner). The multi-arch MCP server image is
# published to GHCR only for a release tag (v*), after every test job passed.

on:
  push:
    branches: [go-rewrite, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e_events:
        description: Events the end-to-end load test sends
        default: "3000"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go-unit:
    name: unit ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - mcp-server
          - plugins/rawbbit-game-events/claude
          - plugins/rawbbit-game-events/codex
          - tools/loadgen
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: go vet
        run: go vet ./... && go vet -tags integration ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Cross-compile linux/amd64 and linux/arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...

      # The plugins ship SDK snapshots with a hash manifest.
      - name: Verify the plugin and its SDK bundle
        if: startsWith(matrix.module, 'plugins/')
        run: |
          go run ./scripts/validate-plugin
          go run ./scripts/verify-bundle

  sdk-js:
    name: unit browser SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/rawbbit-browser-game
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/rawbbit-browser-game/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:source-isolation

  integration:
    name: integration (MCP parity on ClickHouse)
    needs: go-unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: mcp-server/go.mod
          cache-dependency-path: mcp-server/go.sum
      - name: Run the integration suites on a disposable ClickHouse
        run: scripts/test-integration.sh

  e2e:
    name: end-to-end Swarm load test
    needs: go-unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/loadgen/go.mod
          cache-dependency-path: tools/loadgen/go.mod
      - name: Build the MCP image, deploy the stack and run rawbbit-loadgen
        env:
          E2E_EVENTS: ${{ inputs.e2e_events || '3000' }}
        run: quickstart/swarm/e2e.sh --build

  images:
    name: image ${{ matrix.image.name }}
    needs: [integration, e2e, sdk-js]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: rawbbit-mcp-server, context: mcp-server }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.image.name }}

      # The Go build stage cross-compiles natively; QEMU covers the final
      # arm64 stage.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          provenance: false
