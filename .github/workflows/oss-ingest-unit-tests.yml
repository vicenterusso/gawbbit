name: OSS ingest unit tests

on:
  pull_request:
    paths:
      - "backend/collector-api/**"
      - "backend/raw-writer/**"
      - ".github/workflows/oss-ingest-unit-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/collector-api/**"
      - "backend/raw-writer/**"
      - ".github/workflows/oss-ingest-unit-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: ${{ matrix.service }} unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service:
          - collector-api
          - raw-writer
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/${{ matrix.service }}/go.mod
          cache-dependency-path: backend/${{ matrix.service }}/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./... && go vet -tags integration ./...

      - name: Run unit tests
        run: go test -race ./...

      - name: Cross-compile for linux/amd64 and linux/arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
