# Optional off-site copy of the raw Parquet layer to AWS S3.
#
# Enable with AWS_REPLICA_ENABLED=1 in .env; deploy.sh then adds this file.
# rclone copies new objects from SeaweedFS to the AWS bucket on a loop. It
# uses `copy`, never `sync`, so nothing is ever deleted in AWS, and
# `--ignore-existing`, because raw-writer objects are immutable once written.
#
# ClickHouse keeps reading from the local SeaweedFS, so the copy adds no AWS
# egress for normal ingestion; AWS only charges PUT/LIST requests and storage.

services:
  aws-replica:
    image: ${RCLONE_IMAGE:-rclone/rclone:1.71}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        echo "aws_replica_started src=src:$${SRC_BUCKET}/$${SRC_PREFIX} dst=dst:$${AWS_REPLICA_BUCKET}/$${AWS_REPLICA_PREFIX} interval=$${AWS_REPLICA_INTERVAL_SECONDS}s max_age=$${AWS_REPLICA_MAX_AGE}"
        while :; do
          if rclone copy "src:$${SRC_BUCKET}/$${SRC_PREFIX}" "dst:$${AWS_REPLICA_BUCKET}/$${AWS_REPLICA_PREFIX}" \
              --ignore-existing --max-age "$${AWS_REPLICA_MAX_AGE}" \
              --transfers "$${AWS_REPLICA_TRANSFERS}" --checkers 8 \
              --s3-no-check-bucket --stats-one-line --stats 0 -v; then
            echo "aws_replica_pass_ok"
          else
            echo "aws_replica_pass_failed exit=$$?"
          fi
          sleep "$${AWS_REPLICA_INTERVAL_SECONDS}"
        done
    environment:
      SRC_BUCKET: ${S3_BUCKET:-rawbbit-raw}
      SRC_PREFIX: ${S3_PREFIX:-raw}
      AWS_REPLICA_BUCKET: ${AWS_REPLICA_BUCKET:?AWS_REPLICA_BUCKET is required}
      AWS_REPLICA_PREFIX: ${AWS_REPLICA_PREFIX:-raw}
      AWS_REPLICA_INTERVAL_SECONDS: ${AWS_REPLICA_INTERVAL_SECONDS:-300}
      # Objects older than this are skipped on each pass. Raise it (or run a
      # one-off pass without --max-age) after an outage longer than this.
      AWS_REPLICA_MAX_AGE: ${AWS_REPLICA_MAX_AGE:-72h}
      AWS_REPLICA_TRANSFERS: ${AWS_REPLICA_TRANSFERS:-4}
      # Source: SeaweedFS with the read-only credential.
      RCLONE_CONFIG_SRC_TYPE: s3
      RCLONE_CONFIG_SRC_PROVIDER: SeaweedFS
      RCLONE_CONFIG_SRC_ENDPOINT: http://seaweed-s3:8333
      RCLONE_CONFIG_SRC_ACCESS_KEY_ID: ${S3_READER_ACCESS_KEY:?S3_READER_ACCESS_KEY is required}
      RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY: ${S3_READER_SECRET_KEY:?S3_READER_SECRET_KEY is required}
      RCLONE_CONFIG_SRC_FORCE_PATH_STYLE: "true"
      # Destination: AWS S3. The IAM user needs s3:PutObject and s3:ListBucket
      # on the bucket (no delete permission is required).
      RCLONE_CONFIG_DST_TYPE: s3
      RCLONE_CONFIG_DST_PROVIDER: ${AWS_REPLICA_PROVIDER:-AWS}
      RCLONE_CONFIG_DST_REGION: ${AWS_REPLICA_REGION:?AWS_REPLICA_REGION is required}
      RCLONE_CONFIG_DST_ACCESS_KEY_ID: ${AWS_REPLICA_ACCESS_KEY_ID:?AWS_REPLICA_ACCESS_KEY_ID is required}
      RCLONE_CONFIG_DST_SECRET_ACCESS_KEY: ${AWS_REPLICA_SECRET_ACCESS_KEY:?AWS_REPLICA_SECRET_ACCESS_KEY is required}
      RCLONE_CONFIG_DST_STORAGE_CLASS: ${AWS_REPLICA_STORAGE_CLASS:-STANDARD}
      # Leave empty for AWS. For another S3 service set the endpoint and an
      # rclone provider such as Other, Cloudflare, Wasabi or Minio.
      RCLONE_CONFIG_DST_ENDPOINT: ${AWS_REPLICA_ENDPOINT:-}
    networks:
      - rawbbit
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 30s
