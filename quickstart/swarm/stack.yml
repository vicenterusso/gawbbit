# Rawbbit on Docker Swarm.
#
#   game SDK -> Caddy -> Vector -> ClickHouse (analytics.events) -> MCP / Metabase
#
# ClickHouse is the source of truth. Stateful services (ClickHouse, Postgres)
# and the services that own host state (Caddy certificates, the backup
# service) run as one replica pinned to the data node: a manager with the node
# label `rawbbit.data=true`. Their data lives in bind mounts under
# ${RAWBBIT_DATA_ROOT}, so they must never move to another node.
#
# Stateless services (vector, mcp-server, metabase) can run on any node and
# scale with the *_REPLICAS variables.
#
# Deploy with ./deploy.sh, which loads .env, renders the dataset files, names
# the configs and secrets by content hash and runs `docker stack deploy`. See
# README.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-data-node: &data-node
  constraints:
    - node.role == manager
    - node.labels.rawbbit.data == true

x-restart: &restart
  condition: any
  delay: 5s
  window: 30s

x-clickhouse-image: &clickhouse-image ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.8}

x-clickhouse-admin: &clickhouse-admin
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_ADMIN_USER: ${CLICKHOUSE_ADMIN_USER:?CLICKHOUSE_ADMIN_USER is required}
  CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?CLICKHOUSE_ADMIN_PASSWORD is required}

services:
  # ---------------------------------------------------------------- edge
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    logging: *logging
    environment:
      COLLECTOR_PUBLIC_HOSTNAME: ${COLLECTOR_PUBLIC_HOSTNAME:?COLLECTOR_PUBLIC_HOSTNAME is required}
      MCP_PUBLIC_HOSTNAME: ${MCP_PUBLIC_HOSTNAME:?MCP_PUBLIC_HOSTNAME is required}
      METABASE_PUBLIC_HOSTNAME: ${METABASE_PUBLIC_HOSTNAME:?METABASE_PUBLIC_HOSTNAME is required}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:?run ./deploy.sh}
      CORS_MAX_AGE_SECONDS: ${CORS_MAX_AGE_SECONDS:-600}
      TLS_MODE: ${TLS_MODE:-auto}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:?run ./deploy.sh}
    # Host mode keeps the real client address (the routing mesh would SNAT
    # it); Vector hashes it into ingest_ip_hash and looks up its country.
    # TLS_MODE=auto adds port 80 (stack.tls-auto.yml); TLS_MODE=cloudflare
    # adds the origin certificate (stack.tls-cloudflare.yml).
    ports:
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
        mode: host
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - ${RAWBBIT_DATA_ROOT:-/srv/rawbbit}/caddy/data:/data
      - ${RAWBBIT_DATA_ROOT:-/srv/rawbbit}/caddy/config:/config
    networks:
      - rawbbit
    deploy:
      replicas: 1
      placement: *data-node
      restart_policy: *restart
      update_config:
        # Host-mode ports cannot be shared by two tasks on one node.
        order: stop-first

  # ----------------------------------------------------------- ingestion
  # Checks the API key, validates and normalises events and inserts them into
  # ClickHouse in batches. A request is answered only after ClickHouse stored
  # its events, so Vector keeps no state and replicas can run anywhere.
  vector:
    image: ${VECTOR_IMAGE:-timberio/vector:0.62.0-alpine}
    command: ["--config", "/etc/vector/vector.yaml", "--config", "/etc/vector/geoip.yaml"]
    logging: *logging
    environment:
      COLLECTOR_API_KEYS_JSON: ${COLLECTOR_API_KEYS_JSON:?COLLECTOR_API_KEYS_JSON is required}
      IP_HASH_SALT: ${IP_HASH_SALT:?IP_HASH_SALT is required}
      RAWBBIT_APP_DATASETS: ${RAWBBIT_APP_DATASETS:?run ./deploy.sh}
      VECTOR_LOG: ${VECTOR_LOG:-info}
    configs:
      - source: vector_config
        target: /etc/vector/vector.yaml
      - source: vector_geoip
        target: /etc/vector/geoip.yaml
    secrets:
      - clickhouse_vector_password
    # With GEOIP_ENABLED=1 the database is read from the same host path on
    # every node that runs a Vector replica (see README). Without GeoIP the
    # directory can be empty, but it must exist.
    volumes:
      - ${GEOIP_HOST_DIR:-/srv/rawbbit-geoip}:/var/lib/geoip:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8686/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - rawbbit
    stop_grace_period: 30s
    deploy:
      replicas: ${VECTOR_REPLICAS:-1}
      restart_policy: *restart
      placement:
        # 0 = no per-node limit (works on a single node too).
        max_replicas_per_node: ${VECTOR_MAX_REPLICAS_PER_NODE:-0}
        preferences:
          - spread: node.id
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first

  # ----------------------------------------------------------- analytics
  clickhouse:
    image: *clickhouse-image
    logging: *logging
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:?CLICKHOUSE_ADMIN_USER is required}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?CLICKHOUSE_ADMIN_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    configs:
      - source: clickhouse_resource_profile
        target: /etc/clickhouse-server/config.d/resource-profile.xml
      - source: clickhouse_backups
        target: /etc/clickhouse-server/config.d/backups.xml
      - source: clickhouse_users_profile
        target: /etc/clickhouse-server/users.d/resource-profile-users.xml
    volumes:
      - ${RAWBBIT_DATA_ROOT:-/srv/rawbbit}/clickhouse/data:/var/lib/clickhouse
      - ${RAWBBIT_DATA_ROOT:-/srv/rawbbit}/clickhouse/logs:/var/log/clickhouse-server
      - ${RAWBBIT_DATA_ROOT:-/srv/rawbbit}/clickhouse/backups:/backups
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - rawbbit
    stop_grace_period: 60s
    deploy:
      replicas: 1
      placement: *data-node
      restart_policy: *restart
      update_config:
        order: stop-first

  # Creates analytics.events, the service users and every dataset, then exits.
  # It is idempotent; Swarm runs it again whenever one of its inputs (schema,
  # script, passwords, datasets) changes.
  clickhouse-setup:
    image: *clickhouse-image
    entrypoint: ["/bin/bash", "/etc/rawbbit/setup.sh"]
    logging: *logging
    environment:
      <<: *clickhouse-admin
      CLICKHOUSE_MCP_USER: ${CLICKHOUSE_MCP_USER:-rawbbit_mcp}
      CLICKHOUSE_MCP_PASSWORD: ${CLICKHOUSE_MCP_PASSWORD:?CLICKHOUSE_MCP_PASSWORD is required}
      CLICKHOUSE_METABASE_USER: ${CLICKHOUSE_METABASE_USER:-metabase_reader}
      CLICKHOUSE_METABASE_PASSWORD: ${CLICKHOUSE_METABASE_PASSWORD:?CLICKHOUSE_METABASE_PASSWORD is required}
    configs:
      - source: clickhouse_setup
        target: /etc/rawbbit/setup.sh
      - source: clickhouse_schema
        target: /etc/rawbbit/schema.sql
    secrets:
      - clickhouse_vector_password
      - datasets_tsv
    networks:
      - rawbbit
    deploy:
      mode: replicated-job
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  # Daily BACKUP of analytics and every dataset database (see backup.sh).
  clickhouse-backup:
    image: *clickhouse-image
    entrypoint: ["/bin/bash", "/etc/rawbbit/backup.sh"]
    logging: *logging
    environment:
      <<: *clickhouse-admin
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_KEEP_LOCAL: ${BACKUP_KEEP_LOCAL:-7}
      BACKUP_S3_URL: ${BACKUP_S3_URL:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    configs:
      - source: clickhouse_backup
        target: /etc/rawbbit/backup.sh
    # The same directory ClickHouse writes to, for pruning old local copies.
    volumes:
      - ${RAWBBIT_DATA_ROOT:-/srv/rawbbit}/clickhouse/backups:/backups
    networks:
      - rawbbit
    deploy:
      replicas: 1
      placement: *data-node
      restart_policy: *restart

  mcp-server:
    image: ${MCP_SERVER_IMAGE:?MCP_SERVER_IMAGE is required, use a multiarch Go image}
    logging: *logging
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_PATH: ${MCP_PATH:-/mcp}
      MCP_MAX_QUERY_ROWS: ${MCP_MAX_QUERY_ROWS:-500}
      MCP_MAX_SAMPLE_ROWS: ${MCP_MAX_SAMPLE_ROWS:-50}
      MCP_MAX_EXECUTION_SECONDS: ${MCP_MAX_EXECUTION_SECONDS:-30}
      MCP_BOT_USER_AGENT_REGEX: ${MCP_BOT_USER_AGENT_REGEX:-bot|spider|crawler|headless|bytespider|ahrefs|googlebot}
      MCP_API_KEYS_JSON: ${MCP_API_KEYS_JSON:-}
      MCP_ALLOW_UNAUTHENTICATED: ${MCP_ALLOW_UNAUTHENTICATED:-0}
      MCP_JWT_PUBLIC_KEY: ${MCP_JWT_PUBLIC_KEY:-}
      MCP_JWT_JWKS_URI: ${MCP_JWT_JWKS_URI:-}
      MCP_JWT_ISSUER: ${MCP_JWT_ISSUER:-}
      MCP_JWT_AUDIENCE: ${MCP_JWT_AUDIENCE:-}
      MCP_DATASETS_FILE: /run/secrets/mcp_datasets_json
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_MCP_USER:-rawbbit_mcp}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_MCP_PASSWORD:?CLICKHOUSE_MCP_PASSWORD is required}
      CLICKHOUSE_DATABASE: analytics
      CLICKHOUSE_TABLE: events
      CLICKHOUSE_SECURE: "0"
      CLICKHOUSE_VERIFY: "1"
    secrets:
      # The MCP server refuses a registry readable by group or others.
      - source: mcp_datasets_json
        mode: 0400
    networks:
      - rawbbit
    deploy:
      replicas: ${MCP_SERVER_REPLICAS:-1}
      restart_policy: *restart
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    logging: *logging
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      METABASE_DB_NAME: ${METABASE_DB_NAME:-metabase}
      METABASE_DB_USER: ${METABASE_DB_USER:-metabase_app}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?METABASE_DB_PASSWORD is required}
    configs:
      - source: postgres_metabase_init
        target: /docker-entrypoint-initdb.d/01_metabase_database.sh
        mode: 0555
    volumes:
      - ${RAWBBIT_DATA_ROOT:-/srv/rawbbit}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${METABASE_DB_USER}\" -d \"$${METABASE_DB_NAME}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - metabase-db
    stop_grace_period: 60s
    deploy:
      replicas: 1
      placement: *data-node
      restart_policy: *restart
      update_config:
        order: stop-first

  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:v0.63.16}
    logging: *logging
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME:-metabase}
      MB_DB_PORT: "5432"
      MB_DB_HOST: postgres
      MB_DB_USER: ${METABASE_DB_USER:-metabase_app}
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?METABASE_DB_PASSWORD is required}
      JAVA_TIMEZONE: ${METABASE_TIMEZONE:-UTC}
      MB_SITE_URL: https://${METABASE_PUBLIC_HOSTNAME}
    networks:
      - metabase-db
      - rawbbit
    deploy:
      # Metabase state lives in Postgres; it can move between nodes.
      replicas: ${METABASE_REPLICAS:-1}
      restart_policy: *restart
      update_config:
        order: stop-first

networks:
  rawbbit:
    driver: overlay
    driver_opts:
      # IPsec between nodes. Cloud firewalls must allow ESP (IP protocol 50).
      encrypted: "true"
  metabase-db:
    driver: overlay
    internal: true
    driver_opts:
      encrypted: "true"

# Swarm configs and secrets are immutable, so deploy.sh names each one after
# a hash of its content; editing a file rolls the services that use it.
configs:
  caddyfile:
    name: ${CFG_CADDYFILE:?run ./deploy.sh}
    file: ./Caddyfile
  vector_config:
    name: ${CFG_VECTOR_CONFIG:?run ./deploy.sh}
    file: ./vector/vector.yaml
  vector_geoip:
    name: ${CFG_VECTOR_GEOIP:?run ./deploy.sh}
    file: ./vector/geoip-${GEOIP_ENABLED:-0}.yaml
  clickhouse_resource_profile:
    name: ${CFG_CLICKHOUSE_RESOURCE_PROFILE:?run ./deploy.sh}
    file: ./clickhouse/config.d/${CLICKHOUSE_CONFIG_PROFILE_FILE:-low-memory.xml}
  clickhouse_backups:
    name: ${CFG_CLICKHOUSE_BACKUPS:?run ./deploy.sh}
    file: ./clickhouse/config.d/backups.xml
  clickhouse_users_profile:
    name: ${CFG_CLICKHOUSE_USERS_PROFILE:?run ./deploy.sh}
    file: ./clickhouse/users.d/${CLICKHOUSE_USERS_PROFILE_FILE:-low-memory-users.xml}
  clickhouse_schema:
    name: ${CFG_CLICKHOUSE_SCHEMA:?run ./deploy.sh}
    file: ./clickhouse/schema.sql
  clickhouse_setup:
    name: ${CFG_CLICKHOUSE_SETUP:?run ./deploy.sh}
    file: ./clickhouse/setup.sh
  clickhouse_backup:
    name: ${CFG_CLICKHOUSE_BACKUP:?run ./deploy.sh}
    file: ./clickhouse/backup.sh
  postgres_metabase_init:
    name: ${CFG_POSTGRES_METABASE_INIT:?run ./deploy.sh}
    file: ./postgres/01_metabase_database.sh

secrets:
  clickhouse_vector_password:
    name: ${SECRET_CLICKHOUSE_VECTOR_PASSWORD:?run ./deploy.sh}
    file: ./.generated/clickhouse_vector_password
  datasets_tsv:
    name: ${SECRET_DATASETS_TSV:?run ./deploy.sh}
    file: ./.generated/datasets.tsv
  mcp_datasets_json:
    name: ${SECRET_MCP_DATASETS_JSON:?run ./deploy.sh}
    file: ./.generated/mcp-datasets.json
