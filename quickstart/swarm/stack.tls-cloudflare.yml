# TLS_MODE=cloudflare (SSL "Full (strict)"): Caddy serves the Cloudflare
# Origin Certificate on HTTPS_PORT; port 80 is not published. deploy.sh adds
# this file to the stack.
services:
  caddy:
    ports:
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
        mode: host
    secrets:
      - source: origin_cert
        target: origin_cert
      - source: origin_key
        target: origin_key

secrets:
  origin_cert:
    name: ${SECRET_ORIGIN_CERT:?run ./deploy.sh}
    file: ${ORIGIN_CERT_FILE:?ORIGIN_CERT_FILE is required}
  origin_key:
    name: ${SECRET_ORIGIN_KEY:?run ./deploy.sh}
    file: ${ORIGIN_KEY_FILE:?ORIGIN_KEY_FILE is required}
